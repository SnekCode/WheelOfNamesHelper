name: Prepare release PR
on:
  pull_request_target:
    types: [closed, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-prepare-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      # Run trusted master code, never code from a PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: '5245338'
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release.cjs').prepare({ github, context, core });
