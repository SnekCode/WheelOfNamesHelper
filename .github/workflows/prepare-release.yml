name: Prepare release PR
on:
  pull_request_target:
    branches: [master]
    types: [closed, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-prepare-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Run trusted master code, never code from a PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: '5245338'
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: WheelOfNamesHelper
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release.cjs').prepare({ github, context, core });
