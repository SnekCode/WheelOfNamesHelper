name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  release-automation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/release.test.cjs
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        os: [windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 23

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm run test
      
      - name: Build
        run: npm run build
        
